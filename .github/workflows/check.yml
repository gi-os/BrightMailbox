name: Check

# Every branch EXCEPT main. Same compile and the same tests as the release build,
# publishing nothing — so a mistake can be found without cutting a signed APK that
# BrightMarket would hand to a phone minutes later.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Sound toolchain
        run: python3 -m pip install --quiet numpy

      - name: Generate sounds
        run: |
          python3 scripts/build_sounds.py app/src/main/res/raw
          ls -la app/src/main/res/raw

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --info 2>&1 | grep -E 'BMX-DIAG|What went wrong|compileSdk|^> ' | head -40; exit ${PIPESTATUS[0]}

      - name: Compile
        run: ./gradlew :app:assembleDebug --stacktrace

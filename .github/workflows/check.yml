name: Check

# Every branch EXCEPT main. Same compile and the same tests as the release build,
# publishing nothing — so a mistake can be found without cutting a signed APK that
# BrightMarket would hand to a phone minutes later.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # `packages: ''` because the action's default is `tools platform-tools`, and
      # Google has withdrawn `tools` from the SDK repository — sdkmanager now exits 1
      # on "Failed to find package 'tools'" and takes the whole job with it. Nothing
      # here needs it: the runner image ships platform-tools and the platforms, and
      # this step is only wanted for ANDROID_HOME and the licenses.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4

      - name: Sound toolchain
        run: python3 -m pip install --quiet numpy

      - name: Generate sounds
        run: |
          python3 scripts/build_sounds.py app/src/main/res/raw
          ls -la app/src/main/res/raw

      - name: Unit tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Compile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Test release signer rotation
        shell: bash
        run: |
          test_dir=$(mktemp -d "$RUNNER_TEMP/brightmailbox-rotation-test.XXXXXX")
          trap 'rm -rf -- "$test_dir"' EXIT
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          export KEYSTORE_PASSWORD="$(openssl rand -hex 18)" KEY_PASSWORD="$(openssl rand -hex 18)"
          for alias in original rotated unrelated; do
            keytool -genkeypair -storetype JKS -keystore "$test_dir/$alias.jks" -alias "$alias" \
              -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD -keyalg RSA -keysize 2048 \
              -validity 1 -dname "CN=BrightMailbox Disposable $alias"
            keytool -exportcert -keystore "$test_dir/$alias.jks" -alias "$alias" -storepass:env KEYSTORE_PASSWORD \
              | sha256sum | cut -d ' ' -f 1 > "$test_dir/$alias.txt"
          done
          export KEYSTORE_FILE="$test_dir/rotated.jks" KEY_ALIAS=rotated SIGNING_LINEAGE_FILE="$test_dir/signing.lineage"
          "$apksigner" rotate --out "$SIGNING_LINEAGE_FILE" \
            --old-signer --ks "$test_dir/original.jks" --ks-key-alias original \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --set-installed-data true --set-rollback false \
            --new-signer --ks "$KEYSTORE_FILE" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD
          bash scripts/sign-release.sh "$unsigned" "$test_dir/rotated.apk" "$test_dir/original.txt" "$test_dir/rotated.txt"

          printf '%064d\n' 0 > "$test_dir/wrong-pin.txt"
          if bash scripts/sign-release.sh "$unsigned" "$test_dir/wrong-root.apk" "$test_dir/wrong-pin.txt" "$test_dir/rotated.txt" > "$test_dir/rejection.log"; then
            echo '::error::Release signing accepted an unexpected lineage root'
            exit 1
          fi
          grep -Fx '::error::APK lineage must link the pinned original and rotated certificates' "$test_dir/rejection.log"

          if bash scripts/sign-release.sh "$unsigned" "$test_dir/wrong-signer.apk" "$test_dir/original.txt" "$test_dir/wrong-pin.txt" > "$test_dir/rejection.log"; then
            echo '::error::Release signing accepted an unexpected rotated signer'
            exit 1
          fi
          grep -Fx '::error::APK must verify with the pinned rotated signer using signature scheme v3' "$test_dir/rejection.log"

          "$apksigner" rotate --out "$test_dir/unrelated.lineage" \
            --old-signer --ks "$test_dir/unrelated.jks" --ks-key-alias unrelated \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --set-installed-data true --set-rollback false \
            --new-signer --ks "$KEYSTORE_FILE" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD
          if SIGNING_LINEAGE_FILE="$test_dir/unrelated.lineage" bash scripts/sign-release.sh "$unsigned" "$test_dir/unrelated.apk" "$test_dir/original.txt" "$test_dir/rotated.txt" > "$test_dir/rejection.log"; then
            echo '::error::Release signing accepted an unrelated lineage'
            exit 1
          fi
          grep -Fx '::error::APK lineage must link the pinned original and rotated certificates' "$test_dir/rejection.log"

          touch "$test_dir/empty.txt"
          for invalid in empty original; do
            if bash scripts/sign-release.sh "$unsigned" "$test_dir/invalid.apk" "$test_dir/original.txt" "$test_dir/$invalid.txt" > "$test_dir/rejection.log"; then
              echo '::error::Release signing accepted empty or identical pins'
              exit 1
            fi
            grep -Fx '::error::Pin distinct original and rotated release certificate fingerprints' "$test_dir/rejection.log"
          done

name: Check

# Every branch EXCEPT main. Same compile and the same tests as the release build,
# publishing nothing — so a mistake can be found without cutting a signed APK that
# BrightMarket would hand to a phone minutes later.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # `packages: ''` because the action's default is `tools platform-tools`, and
      # Google has withdrawn `tools` from the SDK repository — sdkmanager now exits 1
      # on "Failed to find package 'tools'" and takes the whole job with it. Nothing
      # here needs it: the runner image ships platform-tools and the platforms, and
      # this step is only wanted for ANDROID_HOME and the licenses.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4

      - name: Sound toolchain
        run: python3 -m pip install --quiet numpy

      - name: Generate sounds
        run: |
          python3 scripts/build_sounds.py app/src/main/res/raw
          ls -la app/src/main/res/raw

      - name: Unit tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Compile
        env:
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:assembleDebug --stacktrace
